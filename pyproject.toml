[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    # `google` extra = the Gemini LLM (AI Studio key), primary link in the
    # provider chain. >=1.8.1 is the floor livekit-plugins-sarvam requires.
    "livekit-agents[google,silero]>=1.8.1",
    "livekit-plugins-ai-coustics~=0.2",
    # Sarvam AI: STT + TTS on one SARVAM_API_KEY. Pulls livekit-agents[codecs,
    # openai] transitively - which is also what backs Cerebras below.
    "livekit-plugins-sarvam>=1.8.1",
    # Groq: second link in the LLM fallback chain. Cerebras is third and needs no
    # dependency of its own - it rides the openai plugin Sarvam already pulls.
    "livekit-plugins-groq>=1.8.1",
    "python-dotenv",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "tenacity>=9.0",
    "httpx>=0.28",
    # Persistence. Relational only - triage/formulary retrieval is lexical,
    # so there is no vector store and no embedding model to download.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=44.0",
    "livekit-plugins-groq>=1.8.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    # Lets the DB test suite run on SQLite - no Docker/Postgres needed locally.
    "aiosqlite>=0.20",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
