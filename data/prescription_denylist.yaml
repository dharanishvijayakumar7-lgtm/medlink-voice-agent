# Drugs and drug classes MedLink must NEVER name to a caller.
#
# The medicine pipeline already builds its spoken text only from the curated
# formulary, so this is a backstop for the one failure mode it cannot prevent:
# the LLM volunteering a drug from its own training data ("just take
# azithromycin"). Scanned over generated speech before it reaches TTS by
# src/safety/guardrails.py.
#
# Everything here is prescription-only in India (Schedule H/H1/X), withdrawn,
# or a class that must never be self-prescribed. Add freely - a false positive
# only costs one re-worded sentence.

classes:
  - antibiotic
  - antibiotics
  - antibiotic tablet
  - steroid
  - steroids
  - corticosteroid
  - injection
  - injectable
  - iv drip
  - saline drip
  - painkiller injection
  - sleeping pill
  - sleeping pills
  - sedative
  - antidepressant
  - blood thinner

drugs:
